{% extends "base.html" %}
{% block title %}Edit Question · Glicko{% endblock %}
{% block content %}

<div class="center-panel center-panel-wide">
  <div class="panel panel-large">
    <h1>Edit Question</h1>
    <form method="post" class="stack-form">
      <label>Topic</label>
      <select name="topic_id" required>
        {% for t in topics %}
        <option value="{{ t.id }}" {{ 'selected' if t.id == q.topic_id }}>{{ t.subject_name }} — {{ t.name }}</option>
        {% endfor %}
      </select>

      <label>Question Prompt <span class="muted small">(drag or paste images seamlessly)</span></label>
      <div class="rich-editor rich-editor-lg" contenteditable="true" data-target="text-input"></div>
      <input type="hidden" name="text" id="text-input" value="{{ q.text }}" required>

      <label>Answer / Solution</label>
      <div class="rich-editor rich-editor-lg" contenteditable="true" data-target="answer-input"></div>
      <input type="hidden" name="answer" id="answer-input" value="{{ q.answer or '' }}">

      <div class="button-row">
        <a href="{{ url_for('questions') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
