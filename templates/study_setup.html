{% extends "base.html" %}
{% block title %}Study · Glicko{% endblock %}
{% block content %}

<div class="center-panel">
  <h1>Start studying</h1>
  <p class="muted">Sessions run for as long as you like. Topics and questions are picked automatically — weaker topics show up more, but nothing's ever off-limits.</p>

  <form method="post" action="{{ url_for('study_start') }}" class="stack-form">
    <label>Subject</label>
    <select name="subject_id">
      <option value="">All subjects</option>
      {% for s in subjects %}
      <option value="{{ s.id }}">{{ s.name }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary btn-lg btn-block">Start session</button>
  </form>
</div>

{% endblock %}
